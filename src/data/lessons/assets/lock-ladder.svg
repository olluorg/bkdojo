<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="lad-arr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#2b6ef2"/>
    </marker>
    <style>
      .title { fill:#15202e; font-size:23px; font-weight:800; text-anchor:middle; }
      .sub { fill:#5a6675; font-size:13px; text-anchor:middle; }
      .num { fill:#ffffff; font-size:14px; font-weight:800; text-anchor:middle; }
      .name { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:15px; font-weight:700; fill:#1a52c4; }
      .add { fill:#178a48; font-size:12.5px; }
      .cost { fill:#c98a12; font-size:12px; }
      .use { fill:#5a6675; font-size:12px; }
    </style>
  </defs>

  <rect x="0" y="0" width="900" height="470" fill="#ffffff"/>

  <text class="title" x="450" y="34">Лестница lock'ов</text>
  <text class="sub" x="450" y="58">synchronized по умолчанию — поднимайся выше, только когда его не хватает</text>

  <!-- connectors between rungs -->
  <line x1="48" y1="131" x2="108" y2="193" stroke="#2b6ef2" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#lad-arr)"/>
  <line x1="108" y1="223" x2="168" y2="285" stroke="#2b6ef2" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#lad-arr)"/>
  <line x1="168" y1="315" x2="228" y2="377" stroke="#2b6ef2" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#lad-arr)"/>

  <!-- Rung 1: synchronized -->
  <g>
    <rect x="24" y="86" width="852" height="80" rx="12" fill="#ffffff" stroke="#e2e8f1"/>
    <circle cx="48" cy="116" r="15" fill="#2b6ef2"/>
    <text class="num" x="48" y="121">1</text>
    <text class="name" x="74" y="115">synchronized</text>
    <text class="add" x="74" y="136">＋ просто, освобождается автоматически</text>
    <text class="use" x="74" y="154">выбор по умолчанию — пока не нужно ничего сверх взаимного исключения</text>
  </g>

  <!-- Rung 2: ReentrantLock -->
  <g>
    <rect x="84" y="178" width="792" height="80" rx="12" fill="#ffffff" stroke="#e2e8f1"/>
    <circle cx="108" cy="208" r="15" fill="#2b6ef2"/>
    <text class="num" x="108" y="213">2</text>
    <text class="name" x="134" y="207">ReentrantLock</text>
    <text class="add" x="134" y="228">＋ tryLock/таймаут, прерываемость, fairness, несколько Condition</text>
    <text class="cost" x="134" y="246">－ цена: unlock снимаешь вручную в finally</text>
  </g>

  <!-- Rung 3: ReentrantReadWriteLock -->
  <g>
    <rect x="144" y="270" width="732" height="80" rx="12" fill="#ffffff" stroke="#e2e8f1"/>
    <circle cx="168" cy="300" r="15" fill="#2b6ef2"/>
    <text class="num" x="168" y="305">3</text>
    <text class="name" x="194" y="299">ReentrantReadWriteLock</text>
    <text class="add" x="194" y="320">＋ много читателей одновременно ИЛИ один писатель</text>
    <text class="cost" x="194" y="338">－ цена: выгода только на read-heavy, при частой записи хуже</text>
  </g>

  <!-- Rung 4: StampedLock -->
  <g>
    <rect x="204" y="362" width="672" height="80" rx="12" fill="#ffffff" stroke="#e2e8f1"/>
    <circle cx="228" cy="392" r="15" fill="#2b6ef2"/>
    <text class="num" x="228" y="397">4</text>
    <text class="name" x="254" y="391">StampedLock</text>
    <text class="add" x="254" y="412">＋ оптимистичное чтение — почти бесплатные чтения</text>
    <text class="cost" x="254" y="430">－ цена: не реентерабелен, без Condition</text>
  </g>
</svg>
