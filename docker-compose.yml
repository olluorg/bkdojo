services:
  bkdojo:
    build:
      context: .
      args:
        # Build-time: the micro-platform LLM proxy URL that enables server-side
        # eval (baked into the bundle). Empty = server evaluator off. Users supply
        # their own OpenRouter key in-app; no server secret is needed here.
        VITE_EVAL_ENDPOINT: ${VITE_EVAL_ENDPOINT:-}
    ports:
      - '3000:3000'
    environment:
      - PORT=3000
    restart: unless-stopped
